    </div>

  </div>
</div>

<script>
/* ================================
   KJ STUDIO 20.0 — FUNCTION ENGINE
================================ */

let mediaRecorder = null;
let audioChunks = [];
let recordingBlob = null;
let recordingURL = null;
let recordingStream = null;
let timerInterval = null;
let recordingSeconds = 0;
let isRecording = false;

let beatAudio = new Audio();
beatAudio.preload = "metadata";

let bpm = 100;
let metronomeOn = false;
let metroTimer = null;

const $ = id => document.getElementById(id);

/* ================================
   RECORDING
================================ */

async function startRecording(){

  try{

    recordingStream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    audioChunks = [];

    let mime = "";

    if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus")){
      mime = "audio/webm;codecs=opus";
    }else if(MediaRecorder.isTypeSupported("audio/webm")){
      mime = "audio/webm";
    }else{
      mime = "";
    }

    mediaRecorder = mime
      ? new MediaRecorder(recordingStream,{mimeType:mime})
      : new MediaRecorder(recordingStream);

    mediaRecorder.ondataavailable = e => {

      if(e.data && e.data.size > 0){
        audioChunks.push(e.data);
      }

    };

    mediaRecorder.onstop = finishRecording;

    mediaRecorder.start();

    isRecording = true;

    recordingSeconds = 0;
    updateTimer();

    timerInterval = setInterval(()=>{

      recordingSeconds++;
      updateTimer();

    },1000);

    $("recordBtn").classList.add("recording");
    $("waveform").classList.add("active");

    $("liveStatus").classList.add("recording");
    $("liveStatus").lastChild.textContent = " RECORDING";

    $("recordText").textContent = "STOP RECORDING";

  }catch(error){

    alert(
      "Microphone access is required.\n\n" +
      "Please allow microphone permission in your browser."
    );

    console.error(error);

  }

}


function stopRecording(){

  if(!mediaRecorder || mediaRecorder.state === "inactive"){
    return;
  }

  mediaRecorder.stop();

  if(recordingStream){

    recordingStream.getTracks().forEach(track=>{
      track.stop();
    });

  }

  clearInterval(timerInterval);

  isRecording = false;

  $("recordBtn").classList.remove("recording");
  $("waveform").classList.remove("active");

  $("liveStatus").classList.remove("recording");
  $("liveStatus").lastChild.textContent = " READY";

  $("recordText").textContent = "START RECORDING";

}


function finishRecording(){

  const type =
    mediaRecorder.mimeType ||
    "audio/webm";

  recordingBlob =
    new Blob(audioChunks,{type:type});

  if(recordingURL){
    URL.revokeObjectURL(recordingURL);
  }

  recordingURL =
    URL.createObjectURL(recordingBlob);

  $("recordedAudio").src = recordingURL;

  $("trackResult").classList.add("show");

  addToLibrary(
    "KJ Studio Recording " +
    new Date().toLocaleTimeString()
  );

}


/* ================================
   TIMER
================================ */

function updateTimer(){

  const min =
    Math.floor(recordingSeconds / 60)
      .toString()
      .padStart(2,"0");

  const sec =
    (recordingSeconds % 60)
      .toString()
      .padStart(2,"0");

  $("timer").textContent =
    min + ":" + sec;

}


/* ================================
   RECORD BUTTONS
================================ */

$("recordBtn").addEventListener("click",()=>{

  if(isRecording){
    stopRecording();
  }else{
    startRecording();
  }

});


$("recordText").addEventListener("click",()=>{

  if(isRecording){
    stopRecording();
  }else{
    startRecording();
  }

});


/* ================================
   RESET
================================ */

$("resetBtn").addEventListener("click",()=>{

  if(isRecording){
    stopRecording();
  }

  recordingSeconds = 0;
  updateTimer();

  $("trackResult").classList.remove("show");

  $("recordedAudio").pause();
  $("recordedAudio").removeAttribute("src");

  if(recordingURL){
    URL.revokeObjectURL(recordingURL);
    recordingURL = null;
  }

  recordingBlob = null;
  audioChunks = [];

});


/* ================================
   DOWNLOAD RECORDING
================================ */

$("saveBtn").addEventListener("click",()=>{

  if(!recordingBlob){

    alert("Record something first.");

    return;
  }

  const url =
    URL.createObjectURL(recordingBlob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download =
    "KJ-Studio-Recording-" +
    Date.now() +
    ".webm";

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);

});


/* ================================
   BEAT PLAYER
================================ */

$("beatInput").addEventListener("change",function(){

  const file = this.files[0];

  if(!file) return;

  if(beatAudio.src){
    URL.revokeObjectURL(beatAudio.src);
  }

  beatAudio.src =
    URL.createObjectURL(file);

  beatAudio.load();

  $("beatName").textContent =
    file.name;

  $("beatMeta").textContent =
    "Instrumental • " +
    formatBytes(file.size);

});


$("playBtn").addEventListener("click",()=>{

  if(!beatAudio.src){

    alert("Select a beat first.");

    return;
  }

  if(beatAudio.paused){

    beatAudio.play()
      .then(()=>{
        $("playBtn").textContent = "❚❚";
      })
      .catch(error=>{
        console.error(error);
      });

  }else{

    beatAudio.pause();

    $("playBtn").textContent = "▶";

  }

});


beatAudio.addEventListener("loadedmetadata",()=>{

  $("duration").textContent =
    formatTime(beatAudio.duration);

});


beatAudio.addEventListener("timeupdate",()=>{

  if(!beatAudio.duration) return;

  const percent =
    (beatAudio.currentTime /
    beatAudio.duration) * 100;

  $("progressFill").style.width =
    percent + "%";

  $("currentTime").textContent =
    formatTime(beatAudio.currentTime);

});


beatAudio.addEventListener("ended",()=>{

  $("playBtn").textContent = "▶";

  $("progressFill").style.width = "0%";

});


$("clearBeat").addEventListener("click",()=>{

  beatAudio.pause();

  beatAudio.removeAttribute("src");

  beatAudio.load();

  $("beatInput").value = "";

  $("beatName").textContent =
    "No beat selected";

  $("beatMeta").textContent =
    "Ready for your instrumental";

  $("currentTime").textContent =
    "00:00";

  $("duration").textContent =
    "00:00";

  $("progressFill").style.width =
    "0%";

  $("playBtn").textContent = "▶";

});


/* ================================
   BPM
================================ */

function setBPM(value){

  bpm =
    Math.max(40,Math.min(220,value));

  $("bpmValue").textContent =
    bpm;

  $("bpmSlider").value =
    bpm;

  restartMetronome();

}


$("bpmDown").addEventListener("click",()=>{

  setBPM(bpm - 1);

});


$("bpmUp").addEventListener("click",()=>{

  setBPM(bpm + 1);

});


$("bpmSlider").addEventListener("input",e=>{

  setBPM(Number(e.target.value));

});


/* ================================
   METRONOME
================================ */

$("metroToggle").addEventListener("click",()=>{

  metronomeOn =
    !metronomeOn;

  $("metroToggle")
    .classList.toggle("on",metronomeOn);

  restartMetronome();

});


function restartMetronome(){

  if(metroTimer){
    clearInterval(metroTimer);
    metroTimer = null;
  }

  if(!metronomeOn) return;

  const interval =
    60000 / bpm;

  playClick();

  metroTimer =
    setInterval(playClick,interval);

}


function playClick(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext) return;

    if(!window.kjAudioContext){

      window.kjAudioContext =
        new AudioContext();

    }

    const ctx =
      window.kjAudioContext;

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.frequency.value = 900;

    gain.gain.setValueAtTime(
      0.12,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + 0.08
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.08);

  }catch(e){}

}


/* ================================
   MIXER
================================ */

$("beatVolume").addEventListener("input",e=>{

  const value =
    Number(e.target.value);

  $("beatValue").textContent =
    value + "%";

  $("beatMeter").style.width =
    value + "%";

  beatAudio.volume =
    value / 100;

});


$("vocalVolume").addEventListener("input",e=>{

  const value =
    Number(e.target.value);

  $("vocalValue").textContent =
    value + "%";

  $("vocalMeter").style.width =
    value + "%";

});


/* ================================
   EFFECTS
================================ */

document
.querySelectorAll(".effect")
.forEach(button=>{

  button.addEventListener("click",()=>{

    document
      .querySelectorAll(".effect")
      .forEach(b=>{
        b.classList.remove("active");
      });

    button.classList.add("active");

    const effect =
      button.dataset.effect;

    console.log(
      "KJ Studio effect:",
      effect
    );

  });

});


/* ================================
   TRIM CONTROLS
================================ */

$("trimStart").addEventListener("input",e=>{

  const value =
    Number(e.target.value);

  $("trimStartValue").textContent =
    value + "%";

  if(
    beatAudio.duration &&
    value < Number($("trimEnd").value)
  ){

    beatAudio.currentTime =
      beatAudio.duration *
      value / 100;

  }

});


$("trimEnd").addEventListener("input",e=>{

  let value =
    Number(e.target.value);

  if(
    value <= Number($("trimStart").value)
  ){

    value =
      Number($("trimStart").value) + 1;

    $("trimEnd").value =
      value;

  }

  $("trimEndValue").textContent =
    value + "%";

});


beatAudio.addEventListener("timeupdate",()=>{

  if(!beatAudio.duration) return;

  const endPercent =
    Number($("trimEnd").value);

  const endTime =
    beatAudio.duration *
    endPercent / 100;

  if(
    beatAudio.currentTime >= endTime &&
    !beatAudio.paused
  ){

    beatAudio.pause();

    $("playBtn").textContent = "▶";

  }

});


/* ================================
   MICROPHONE TEST
================================ */

$("micBtn").addEventListener("click",async()=>{

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    stream
      .getTracks()
      .forEach(track=>track.stop());

    alert(
      "🎙️ Microphone is working!\n\n" +
      "KJ Studio has microphone access."
    );

  }catch(error){

    alert(
      "❌ Microphone access was denied.\n\n" +
      "Allow microphone permission in your browser settings."
    );

  }

});


/* ================================
   SETTINGS
================================ */

$("settingsBtn").addEventListener("click",()=>{

  $("settingsModal")
    .classList.add("show");

});


$("closeSettings").addEventListener("click",()=>{

  $("settingsModal")
    .classList.remove("show");

});


$("settingsModal").addEventListener("click",e=>{

  if(e.target === $("settingsModal")){

    $("settingsModal")
      .classList.remove("show");

  }

});


/* ================================
   ABOUT
================================ */

$("aboutBtn").addEventListener("click",()=>{

  alert(
    "KJ Studio 20.0\n\n" +
    "Record • Create • Mix • Produce\n\n" +
    "Built by KJ Studio"
  );

});


/* ================================
   LIBRARY
================================ */

let library =
  JSON.parse(
    localStorage.getItem("kjStudioLibrary") || "[]"
  );


function addToLibrary(name){

  library.unshift({
    name:name,
    date:new Date().toLocaleString()
  });

  library =
    library.slice(0,20);

  localStorage.setItem(
    "kjStudioLibrary",
    JSON.stringify(library)
  );

  renderLibrary();

}


function renderLibrary(){

  const box =
    $("libraryItems");

  if(!library.length){

    box.innerHTML =
      '<div class="panel-sub">No recordings yet.</div>';

    return;
  }

  box.innerHTML = "";

  library.forEach((item,index)=>{

    const row =
      document.createElement("div");

    row.className =
      "library-item";

    row.innerHTML = `
      <span>
        ${escapeHTML(item.name)}
      </span>

      <button data-index="${index}">
        Use
      </button>
    `;

    box.appendChild(row);

  });

}


$("libraryBtn").addEventListener("click",()=>{

  $("libraryPanel")
    .classList.add("show");

  renderLibrary();

  $("libraryPanel")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

});


$("closeLibrary").addEventListener("click",()=>{

  $("libraryPanel")
    .classList.remove("show");

});


/* ================================
   UTILITIES
================================ */

function formatTime(seconds){

  if(!isFinite(seconds)){
    return "00:00";
  }

  const min =
    Math.floor(seconds / 60)
      .toString()
      .padStart(2,"0");

  const sec =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2,"0");

  return min + ":" + sec;

}


function formatBytes(bytes){

  if(bytes < 1024){
    return bytes + " B";
  }

  if(bytes < 1024 * 1024){
    return (bytes / 1024).toFixed(1) + " KB";
  }

  return (bytes / (1024 * 1024)).toFixed(1) + " MB";

}


function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* ================================
   INITIALIZE
================================ */

$("beatVolume").dispatchEvent(
  new Event("input")
);

$("vocalVolume").dispatchEvent(
  new Event("input")
);

$("bpmSlider").dispatchEvent(
  new Event("input")
);

renderLibrary();

console.log("KJ Studio 20.0 engine loaded successfully.");

</script>

</body>
</html>
